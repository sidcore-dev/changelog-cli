[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changelog-cli"
version = "1.0.0"
description = "Generate a Markdown changelog from git commit history, grouped by Conventional Commits type, with no dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sidcore-dev" }]
keywords = ["changelog", "git", "conventional-commits", "cli", "devtools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
changelog-cli = "changelog_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
